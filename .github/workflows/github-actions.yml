name: Deploy portfolio to Netlify

on:
  push:
    branches: [main]
  workflow_dispatch:

# A second push should not deploy concurrently with an in-progress deployment.
concurrency:
  group: netlify-production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Portfolio-Client/package-lock.json

      - name: Install dependencies
        working-directory: Portfolio-Client
        run: npm ci --legacy-peer-deps

      - name: Build production site
        working-directory: Portfolio-Client
        env:
          # Create React App treats its existing lint warnings as build failures
          # when CI=true (as GitHub Actions sets by default).
          CI: "false"
        run: npm run build

      - name: Deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: >
          npx --yes netlify-cli@17 deploy
          --auth "$NETLIFY_AUTH_TOKEN"
          --site "$NETLIFY_SITE_ID"
          --dir Portfolio-Client/build
          --config Portfolio-Client/netlify.toml
          --prod
